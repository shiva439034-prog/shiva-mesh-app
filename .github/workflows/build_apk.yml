name: Autonomous APK Factory

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory /__w/shiva-mesh-app/shiva-mesh-app

      - name: Execute Autonomous Build
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
