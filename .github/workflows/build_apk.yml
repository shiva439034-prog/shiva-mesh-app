name: Autonomous APK Factory

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Factory Tools & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: 4. Execute Autonomous Build
      run: |
        buildozer -v android debug

    - name: 5. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shiva-mesh-apk
        path: bin/*.apk
